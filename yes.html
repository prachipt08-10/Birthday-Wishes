<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        background: pink;
        text-align: center;
        font-family: Arial, sans-serif;
        padding: 20px;
        margin: 0;
      }
      #buttonBox {
        margin-top: 40px;
        display: flex;
        justify-content: center;
        gap: 20px;
        flex-wrap: wrap;
      }

      button {
        font-size: clamp(18px, 4vw, 30px);
        padding: 15px 35px;
        cursor: pointer;
        border-radius: 15px;
        border: none;
        font-weight: bold;
        transition: transform 0.3s ease;
      }

      button:hover {
        transform: scale(1.1);
      }

      .btn-yes {
        background-color: rgb(255, 100, 150);
      }

      .btn-no {
        background-color: rgb(255, 200, 200);
      }
      p {
        font-family: Arial, sans-serif;
        padding: 20px;
        font-family: "Trebuchet MS", "Lucida Sans Unicode", "Lucida Grande",
          "Lucida Sans", Arial, sans-serif;
        font: bolder;
        font-size: 40px;
      }
    </style>
  </head>
  <body>
    <h1>chala chingum cake kaaap aataaa</h1>
    <div class="cake">
      <img src="prachi.gif" alt="" />
    </div>
    <div>
      <p>happy birthday chingum god blessed u enjoy your dayy miss youuu</p>
    </div>
  </body>
</html>
