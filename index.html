
<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Card</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        overflow-x: hidden;
        text-align: center;
        background: linear-gradient(#4facfe, #d9f1ff);
        padding: 20px;
        font-family: Arial, sans-serif;
      }

      h1 {
        margin-top: 20px;
        font-size: clamp(35px, 8vw, 70px);
        font-weight: bold;
        color: #ffffff;
        animation: title 2s ease infinite;
        text-shadow: 0 0 15px #0066cc;
      }

      @keyframes title {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-20px);
        }
      }

      .card {
        margin-top: 40px;
        display: flex;
        justify-content: center;
        flex-wrap: wrap;
        gap: 25px;
      }

      #container,
      #container2,
      #container3 {
        width: clamp(250px, 80vw, 350px);
        min-height: 420px;
        background: #ffffff;
        border-radius: 12px;
        border: 2px solid #0066cc;
        padding: 15px;
        font-size: clamp(20px, 4.5vw, 32px);
        font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
        text-align: center;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 10px;
        box-shadow: 0 0 20px rgba(0, 102, 204, 0.4);
      }

      .sticker {
        width: clamp(150px, 55vw, 250px);
        animation: sticker 3s ease-in-out infinite;
        margin: auto;
      }

      @keyframes sticker {
        0% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-8px);
        }
        100% {
          transform: translateY(0);
        }
      }

      #btn-container {
        margin-top: 40px;
      }

      #btn-container button {
        font-size: clamp(20px, 5vw, 40px);
        padding: 15px 35px;
        cursor: pointer;
        border-radius: 12px;
        border: 2px solid #0052a3;
        font-weight: bold;
        transition: 0.3s ease;
        background-color: #e6f4ff;
        color: #0052a3;
        box-shadow: 0 0 15px #0066cc;
      }

      #btn-container button:hover {
        transform: scale(1.1);
        background-color: #3399ff;
        color: white;
      }
    </style>
  </head>
  <body>
    <h1>Hey Love !!</h1>

    <div class="card">
      <div id="container">
        One beautiful chapter began with you❤️
   
       <br />
        <img src="first.jpg" class="sticker" width="250px" />
      </div>
      <div id="container2">
        My favourite person, my safest place, my happiest memories❤️
        <br />
        <img src="second.jpg" class="sticker" width="220px" alt="bear" />
      </div>
      <div id="container3">
        Happy Birthday to the one who makes ordinary moments feel special❤️
        <br />
        <img src="third.jpg" class="sticker" width="250px" alt="" />
      </div>
    </div>

    <div id="btn-container">
      <a href="suprise.html">
        <button onclick="show()">chal sonu aata click kar ithe</button>
      </a>
    </div>

    <script>
      function show() {
        alert("Get ready for your supriseeee! 💖✨");
        window.location.href = "suprise.html";
      }
    </script>
  </body>
</html>
