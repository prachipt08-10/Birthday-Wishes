<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>birthday</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
        text-align: center;
        overflow-x: hidden;
        background: #f8e6f8;
      }

      h1 {
        color: rgb(190, 131, 190);
        font-size: clamp(30px, 6vw, 60px);
        margin: 20px 10px;
        animation: birthday 3s ease-in-out infinite;
      }

      h1:hover {
        color: lightsalmon;
      }

      @keyframes birthday {
        0% {
          transform: translate(0, 0);
        }
        50% {
          transform: translate(20px, -10px);
        }
        100% {
          transform: scale(1.05);
        }
      }

      .i p,
      .text p {
        font-family: Impact, Haettenschweiler, "Arial Narrow Bold", sans-serif;
        font-size: clamp(18px, 3vw, 50px);
        color: rgb(156, 8, 139);
        padding: 10px 20px;
        line-height: 1.3;
      }

      #bgVideo {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        z-index: -1;
      }

      .cake {
        display: flex;
        justify-content: center;
        align-items: center;
        margin: 20px 0;
      }

      .cake img {
        max-width: 90%;
        height: auto;
        cursor: pointer;
        border-radius: 15px;
        box-shadow: 0 0 20px rgba(156, 8, 139, 0.6);
        transition: transform 0.3s;
      }

      .cake img:hover {
        transform: scale(1.05);
      }

      @media (max-width: 480px) {
        .i p,
        .text p {
          font-size: 16px;
        }
      }
    </style>
  </head>
  <body>
    <h1>Happiest Birthdayyyyyyyy Rahullll🫂!!!</h1>
    <div class="i">
      <p>
       Soryy tula trass dila pn finallyyyyyy apan udya bhetoyyyyy lvkrachhh sobat birthday celebrate kruya.....
       Can't wait for tooo long to seeee youuuu my love❤️
      </p>
    </div>
    <video autoplay muted loop id="bgVideo">
      <source src="video2.mp4" type="video/mp4" />
    </video>

    <div class="cake">
      <img src="cake2.gif" onclick="goToNextPage()" style="cursor: pointer" />
    </div>
    <div class="text">
      <p>
        Parat ekdaaa Happy Birthdayyyy dear love youuu stay happy and
        healthyyy Forever !!
      </p>
    </div>
    <script>
      function goToNextPage() {
        window.location.href = "cake-choice.html";
      }
    </script>
  </body>
</html>
