<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>flower</title>
    <style>
      body {
        margin: 0;
        padding: 20px;
        background: linear-gradient(to bottom, #ffdee6, #ffe6f0);
        text-align: center;
        font-family: Arial, Helvetica, sans-serif;
      }

      .h p {
        color: #ffb6e6;
        font-size: clamp(25px, 5vw, 45px);
        font-weight: bold;
        margin-bottom: 20px;
      }

      .i img {
        max-width: 90%;
        height: auto;
        animation: full 3s ease-in-out infinite;
        border-radius: 15px;
        box-shadow: 0 0 15px rgba(255, 182, 230, 0.7);
      }

      @keyframes full {
        0%,
        100% {
          transform: scale(1);
        }
        50% {
          transform: scale(1.2);
        }
      }

      .button {
        margin-top: 30px;
      }

      button {
        padding: clamp(15px, 2vw, 25px) clamp(40px, 5vw, 70px);
        font-size: clamp(20px, 5vw, 50px);
        border-radius: 50px;
        border: none;
        background-color: #ffb6e6;
        cursor: pointer;
        transition: 0.3s;
        font-family: Cambria, Cochin, Georgia, Times, "Times New Roman", serif;
        animation: btn 3s ease-in-out infinite;
      }

      @keyframes btn {
        0%,
        100% {
          transform: translate(0, 0);
        }
        50% {
          transform: translate(10px, -5px);
        }
      }

      button:hover {
        background-color: rgb(224, 206, 224);
      }
      @media (max-width: 480px) {
        .h p {
          font-size: 22px;
        }
        button {
          font-size: 18px;
          padding: 12px 30px;
        }
      }
    </style>
  </head>
  <body>
    <div class="h">
      <p>Chal ab flower le bhi le</p>
    </div>
    <div class="i">
      <img src="flower.png" height="700px" alt="" />
    </div>
    <div class="button">
      <button onclick="show()">Click Here</button>
    </div>
    <script>
      function show() {
        window.location.href = "birthday.html";
      }
    </script>
  </body>
</html>
